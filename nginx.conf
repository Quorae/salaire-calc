server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Résolution DNS Docker à chaque requête : nginx démarre même si l'API n'est pas encore là,
    # et suit le conteneur api s'il est recréé avec une autre adresse.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    client_max_body_size 64k;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mcp {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Réponses éventuellement en flux (SSE) : pas de tampon.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
